<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>41. Paralel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/dist/d3-geo.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0b141b; }
  body { display: grid; place-items: center; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1.4 ui-monospace, monospace;
         color: #bbb; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 4px; user-select: none; }
  body.render #hud { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">yükleniyor…</div>
<audio id="vo" src="../ses/hys-04-paralel/voice.wav" preload="auto"></audio>
<script src="../lib/harita-motoru.js"></script>
<script>
'use strict';
// Harita Yalan Söyler · Bölüm 4 — "İstanbul'dan dümdüz doğuya gitsen kaç ülkeden geçerdin?"
// Brif: hys-04-paralel.brief.md. İstanbul'un enlemi (41,0082° K) boyunca hangi ülkelerden geçildiği
// sayfa açılırken Natural Earth 1:50m sınırlarından 0,05° adımla tespit edilir; sayaç, vurgular ve
// tık sesleri bu listeden gelir. Mesafeler: paralel uzunluğu = 2πR·cos(enlem).

/*VO:BEGIN*/ const VO = {"duration":38.66,"lines":[{"id":"l1","start":0.15,"end":4.687,"text":"New York, İstanbul'dan daha güneyde. İnanmıyor musun? Dümdüz doğuya gidelim."},{"id":"l2","start":4.937,"end":9.173,"text":"Hep aynı çizgide: 41° kuzey. Dünyayı dönene kadar kaç ülkeden geçeceğiz?"},{"id":"l3","start":9.423,"end":13.606,"text":"Ermenistan, Azerbaycan, Hazar Denizi... ve Orta Asya'nın tam ortası."},{"id":"l4","start":13.856,"end":17.316,"text":"Çin'i boydan boya geçip Kuzey Kore'ye giriyorsun. Sonra Japonya."},{"id":"l5","start":17.566,"end":21.79,"text":"Pasifik'i aşınca Amerika. İşte New York: İstanbul'dan tam 33 km güneyde."},{"id":"l6","start":22.04,"end":26.938,"text":"Atlantik'ten sonra Portekiz, İspanya ve İtalya. Roma ise İstanbul'dan daha kuzeyde."},{"id":"l7","start":27.188,"end":30.522,"text":"Arnavutluk, Kuzey Makedonya, Yunanistan... ve eve dönüş."},{"id":"l8","start":31.072,"end":33.792,"text":"Toplam: 17 ülke, 30.207 km."},{"id":"l9","start":34.042,"end":36.256,"text":"Sen kaç ülke tahmin etmiştin? Yaz bakalım."}]}; /*VO:END*/
const { C, SANS, MONO, W, SAFE, RAD, R_EARTH, ctx, clamp, lerp, prog, win, ease, fmtNum, text, label, pin, line, baseMap, fillFeature, heading } = HYS;

const LAT = 41.0082, IST = [28.9784, 41.0082], START = 28.9784, END = START + 360;
const NYC = [-74.006, 40.7128], ROMA = [12.4964, 41.9028];
const TR_NAMES = { Armenia: 'Ermenistan', Azerbaijan: 'Azerbaycan', Turkmenistan: 'Türkmenistan', Uzbekistan: 'Özbekistan',
  Kazakhstan: 'Kazakistan', Tajikistan: 'Tacikistan', Kyrgyzstan: 'Kırgızistan', China: 'Çin', 'North Korea': 'Kuzey Kore',
  Japan: 'Japonya', 'United States of America': 'ABD', Portugal: 'Portekiz', Spain: 'İspanya', Italy: 'İtalya',
  Albania: 'Arnavutluk', Macedonia: 'K. Makedonya', Greece: 'Yunanistan', Turkey: 'Türkiye' };
const CIRC = 2 * Math.PI * R_EARTH * Math.cos(LAT * RAD);
const kmNS = p => (p[1] - LAT) * RAD * R_EARTH;              // aynı boylamda kuzey(+)/güney(−) farkı
let SEG = [], FIRST = [], FEAT = {}, HEAD = [];

function crossings(D) {
  const cands = D.COUNTRIES.map(f => ({ f, b: d3.geoBounds(f) })).filter(({ b }) => b[0][1] <= LAT && b[1][1] >= LAT);
  let cur = null;
  for (let lon = START; lon <= END + 1e-9; lon += .05) {
    const L = ((lon + 180) % 360 + 360) % 360 - 180;
    const hit = cands.find(({ f, b }) => (b[0][0] <= b[1][0] ? (L >= b[0][0] && L <= b[1][0]) : (L >= b[0][0] || L <= b[1][0])) && d3.geoContains(f, [L, LAT]));
    const name = hit ? hit.f.properties.name : null;
    if (!cur || cur.name !== name) { if (cur) cur.lon1 = lon; cur = { name, lon0: lon, lon1: END }; SEG.push(cur); }
  }
  SEG = SEG.filter(s => s.name);
  const seen = new Set();
  for (const s of SEG) if (s.name !== 'Turkey' && !seen.has(s.name)) { seen.add(s.name); FIRST.push(s); }
  for (const s of SEG) FEAT[s.name] = D.country(s.name);
}
/** Gezginin boylamı (sarılmamış, START → END) */
function headLon(t) {
  let i = 0; while (i < HEAD.length - 2 && t >= HEAD[i + 1][0]) i++;
  const a = HEAD[i], b = HEAD[i + 1];
  return lerp(a[1], b[1], ease.inOutSine(prog(t, a[0], b[0])));
}
function timeAtLon(lon, DUR) {
  let lo = 0, hi = DUR;
  for (let k = 0; k < 40; k++) { const m = (lo + hi) / 2; headLon(m) < lon ? lo = m : hi = m; }
  return hi;
}
function cam(t, T, DUR) {
  const h = headLon(t);
  let c = [h + 10, 36], k = 1.55;
  const blend = (target, tk, w) => { if (w <= 0) return; const e = ease.inOutCubic(w); c = d3.geoInterpolate(c, target)(e); k = Math.exp(lerp(Math.log(k), Math.log(tk), e)); };
  blend([-74, 41], 3.0, win(t, T.ny - .6, T.nyEnd, .6));
  blend([21, 41.4], 2.4, win(t, T.roma - .6, T.romaEnd, .6));
  blend([29, 25], 1.05, Math.min(prog(t, T.total - .3, T.total + .8), 1 - prog(t, DUR - 1.7, DUR - .25)));
  return { lon: c[0], lat: c[1], k };
}

let TT;
HYS.run({
  vo: VO, cover: 0, seed: 4,
  init(D) { crossings(D); },
  times(L, at, DUR) {
    const T = {
      ny: at(4) + 2.6, nyEnd: at(5) + .5, roma: at(5) + 3.2, romaEnd: at(6) + .3,
      home: at(6, 'end') - .3, total: at(7), q: at(8), DUR,
    };
    HEAD = [[0, START], [at(1), START + 4], [at(2), 43.3], [at(2, 'end') - .2, 76.5], [at(3), 79],
      [at(3) + 2.0, 126.6], [at(3, 'end'), 141.6], [at(4) + 1.4, 236], [T.ny, 286], [T.nyEnd, 287.5],
      [at(5) + 1.2, 351.2], [at(5) + 2.3, 368.3], [T.roma, 373.8], [T.romaEnd, 375],
      [at(6) + .5, 379.6], [T.home, END], [DUR, END]];
    T.enter = FIRST.map(s => timeAtLon(s.lon0 + .01, DUR));
    TT = T;
    return T;
  },
  scenes: (T, at, DUR) => [
    { name: 'kanca', start: 0, end: at(1) }, { name: 'enlem', start: at(1), end: at(2) },
    { name: 'orta asya', start: at(2), end: at(3) }, { name: 'çin-kore-japonya', start: at(3), end: at(4) },
    { name: 'amerika', start: at(4), end: at(5) }, { name: 'avrupa', start: at(5), end: at(6) },
    { name: 'eve dönüş', start: at(6), end: T.total }, { name: 'toplam', start: T.total, end: DUR - 1.7 },
    { name: 'döngü', start: DUR - 1.7, end: DUR },
  ],
  keys: (T, at, DUR) => [[0, 0, 0, 1], [DUR, 0, 0, 1]],      // kamera cam() ile hesaplanır
  projection: () => null,
  draw(t, g) {
    const { T, DUR } = g;
    const cm = cam(t, T, DUR), pr = HYS.globeProjection(cm), path = d3.geoPath(pr, ctx);
    g.pr = pr;
    baseMap(path, { fine: cm.k > 1.9 });
    const h = headLon(t), fade = 1 - prog(t, DUR - 1.6, DUR - .5);

    // geçilen ülkeler
    for (const s of FIRST) {
      const a = prog(t, timeAtLon(s.lon0 + .01, DUR), timeAtLon(s.lon0 + .01, DUR) + .35) * fade;
      fillFeature(path, FEAT[s.name], { color: C.accent, alpha: .32 * a });
    }
    fillFeature(path, FEAT.Turkey, { color: '#B4A78C', stroke: C.ocean, width: 3 });

    // enlem çizgisi: tamamı kesikli, gidilen kısım vurgu
    const ring = Array.from({ length: 361 }, (_, i) => [-180 + i, LAT]);
    line(path, ring, { color: C.text, width: 3, dash: [10, 12], alpha: .55, outline: true });
    const n = Math.max(2, Math.ceil(h - START));
    const trail = Array.from({ length: n + 1 }, (_, i) => [START + (h - START) * i / n, LAT]);
    if (h > START + .05) line(path, trail, { color: C.accent, width: 7, outline: true, alpha: fade });

    const vis = p => HYS.visible(cm, p) ? pr(p) : null;
    pin(vis(IST), { color: C.text, r: 11 });
    pin(vis([h, LAT]), { color: C.accent, r: 14, pulse: (t * 1.2) % 1, alpha: t < DUR - 1.6 ? 1 : 0 });

    // içinde bulunulan ülkenin adı
    const seg = SEG.find(s => h >= s.lon0 && h < s.lon1 && s.name !== 'Turkey' && s.lon1 - s.lon0 > 1.2);
    if (seg && t < T.total) {
      const xy = vis([h, LAT]);
      const quiet = 1 - Math.max(win(t, T.ny - .4, T.nyEnd + .3, .3), win(t, T.roma - .4, T.romaEnd + .3, .3));
      const a = quiet * Math.min(prog(h, seg.lon0, seg.lon0 + .6), 1 - prog(h, seg.lon1 - .6, seg.lon1));
      if (xy) label(TR_NAMES[seg.name] || seg.name, xy[0], xy[1], { font: SANS, weight: 600, alpha: a, dx: 26, dy: -40 });
    }
    // New York ve Roma
    const nyA = win(t, T.ny - .1, T.nyEnd + .2, .3), rA = win(t, T.roma - .1, T.romaEnd + .2, .3);
    const ny = vis(NYC), ro = vis(ROMA);
    pin(ny, { color: C.text, r: 11, alpha: nyA });
    if (ny) label(`New York · ${fmtNum(Math.abs(kmNS(NYC)))} km güneyde`, ny[0], ny[1], { alpha: nyA, dx: -330, dy: 90, size: 42 });
    pin(ro, { color: C.text, r: 11, alpha: rA });
    if (ro) label(`Roma · ${fmtNum(kmNS(ROMA))} km kuzeyde`, ro[0], ro[1], { alpha: rA, dx: -60, dy: -50, size: 42 });
  },
  header(t, g) {
    const { T, DUR, at } = g;
    const hookA = t < DUR - 3 ? 1 - prog(t, at(1) - .3, at(1) + .1) : prog(t, DUR - 1.4, DUR - .6);
    // Kanca (v2, 16 Kas): iddia ilk karede. "New York, İstanbul'dan daha güneyde" + iki satırlık enlem merdiveni.
    heading('New York, İstanbul’dan', hookA, { size: 62 });
    text('daha GÜNEYDE', SAFE.x0, SAFE.y0 + 40 + 80 + 92, 92, { alpha: hookA, color: C.accent });
    const LY = SAFE.y0 + 40 + 80 + 92 + 50;                    // plaka üstü
    if (hookA > .001) {                                         // koyu plaka: küre üstünde okunurluk
      ctx.save(); ctx.globalAlpha = hookA * .92; ctx.fillStyle = C.bg;
      ctx.beginPath(); ctx.roundRect(SAFE.x0 - 24, LY, SAFE.x1 - SAFE.x0 + 48, 150, 18); ctx.fill(); ctx.restore();
    }
    const ladder = (name, lat, y, color, k) => {
      text(name, SAFE.x0, y, 48, { font: MONO, weight: 500, alpha: hookA, color });
      text(`${lat.toFixed(2).replace('.', ',')}°`, SAFE.x1, y, 48, { font: MONO, weight: 500, alpha: hookA, color, align: 'right' });
      const x0 = SAFE.x0 + 280, x1 = SAFE.x1 - 190;
      ctx.save(); ctx.globalAlpha = hookA; ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.setLineDash([10, 10]);
      ctx.beginPath(); ctx.moveTo(x0, y - 16); ctx.lineTo(lerp(x0, x1, ease.outCubic(k)), y - 16); ctx.stroke(); ctx.restore();
    };
    ladder('İSTANBUL', LAT, LY + 62, C.text, prog(t, 0, .7));
    ladder('NEW YORK', NYC[1], LY + 125, C.accent, prog(t, .25, 1.0));

    const h = headLon(t);
    const count = FIRST.filter(s => s.lon0 <= h).length;
    const trA = win(t, at(1) + .12, T.total + .1, .3);
    text(`${count} ülke`, SAFE.x0, SAFE.y0 + 40 + 96, 96, { font: MONO, weight: 500, alpha: trA });
    text(`41° K · ${fmtNum(CIRC * (h - START) / 360)} km`, SAFE.x0, SAFE.y0 + 40 + 96 + 66, 48, { font: MONO, weight: 500, alpha: trA, color: C.mute });

    const toA = win(t, T.total, DUR - 1.5, .3);
    text(`${FIRST.length} ülke`, SAFE.x0, SAFE.y0 + 40 + 96, 104, { font: MONO, weight: 500, alpha: toA, color: C.accent });
    text(`${fmtNum(CIRC)} km`, SAFE.x0, SAFE.y0 + 40 + 96 + 66, 48, { font: MONO, weight: 500, alpha: toA, color: C.mute });
  },
  sounds(T) {
    return [
      ...T.enter.map((t, i) => ({ t, type: 'tick', gain: .22, f: 1200 + i * 40 })),
      { t: T.ny + .1, type: 'ping', gain: .35, f: 659 },
      { t: T.roma + .1, type: 'ping', gain: .35, f: 784 },
      { t: T.total + .1, type: 'ping2', gain: .5 },
    ];
  },
});
</script>
</body>
</html>
