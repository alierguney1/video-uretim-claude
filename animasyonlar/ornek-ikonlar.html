<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İkon Katmanı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/dist/d3-geo.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0b141b; }
  body { display: grid; place-items: center; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1.4 ui-monospace, monospace;
         color: #bbb; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 4px; user-select: none; }
  body.render #hud { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">yükleniyor…</div>
<audio id="vo" preload="none"></audio>
<script src="../lib/ikonlar.js"></script>
<script src="../lib/ikon-seti.js"></script>
<script src="../lib/iller.js"></script>
<script src="../lib/ikon-katmani.js"></script>
<script src="../lib/harita-motoru.js"></script>
<script>
'use strict';
// Örnek: ikon katmanı (lib/ikon-katmani.js). Bölüm değil, katmanın vitrini.
// Sahne 1: 81 il, 81 ikon plaka sırasıyla düşer (durdur-bul karesi), sonra 3 il adı geçince zıplar.
// Sahne 2: kamera açılır, komşu ülkelere bayrak saplanır.

const VO = { duration: 10.4, lines: [
  { start: .1, end: 3.1, text: 'Her ilin bir ikonu var. Durdur, kendi ilini bul.' },
  { start: 3.4, end: 5.6, text: 'Rize çay, Van kedi, Adana kebap.' },
  { start: 6.0, end: 9.9, text: 'Ülkeler de bayrağıyla gelir.' },
] };
const { C, W, SAFE, ctx, prog, win, ease, heading } = HYS;

// Bayrak noktaları: ülkenin içinde, okunur yer (elle seçildi)
const FLAGS = [
  ['tr', 35.2, 39.2], ['gr', 22.0, 39.6], ['bg', 25.2, 42.7], ['ge', 43.6, 42.1], ['am', 44.9, 40.3], ['az', 46.6, 40.3],
  ['ir', 48.2, 34.6], ['iq', 43.6, 33.2], ['sy', 38.6, 35.2], ['cy', 32.55, 34.8], ['kktc', 33.75, 35.3],
  ['eg', 30.0, 26.5], ['ly', 18.0, 27.5], ['jo', 36.8, 30.9], ['sa', 44.0, 25.5], ['ro', 25.0, 45.9],
];
const HL = [['Rize', 3.45], ['Van', 4.25], ['Adana', 5.0]];   // seslendirmede adı geçtiği an

HYS.run({
  vo: VO, cover: 2.9, flat: true, seed: 3,
  init() {
    const feats = IKON.ilSekilleri();
    this.IL_MESH = topojson.mesh(ILLER.topo, ILLER.topo.objects.iller, (a, b) => a !== b);
    this.TR = { type: 'FeatureCollection', features: feats };
  },
  times: (L, at, DUR) => ({ s2: 5.8, f0: 6.4 }),
  scenes: (T, at, DUR) => [{ name: '81 il', start: 0, end: T.s2 }, { name: 'bayraklar', start: T.s2, end: DUR }],
  keys: (T, at, DUR) => [[0, 35.3, 38.85, 16.4], [T.s2, 35.3, 38.85, 16.4], [T.s2 + 1.2, 35.0, 35.6, 7.2], [DUR, 35.0, 35.6, 6.9]],
  draw(t, g) {
    const { path, pr, T, DUR } = g;
    HYS.baseMap(path, { sphere: false });
    // il sınırları sahne 1'de
    const ilA = 1 - prog(t, T.s2, T.s2 + .8);
    if (ilA > 0) {
      ctx.globalAlpha = ilA; ctx.strokeStyle = 'rgba(15,28,38,.38)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); path(this.IL_MESH); ctx.stroke(); ctx.globalAlpha = 1;
    }
    // 81 ikon: kamera açılırken küçülerek kaybolur
    const k = g.cam.k / 16.4, size = 50 * Math.max(.35, k);
    if (ilA > 0) {
      const spot = win(t, HL[0][1], HL[HL.length - 1][1] + .8, .2);           // vurgu varken diğerleri geri çekilir
      IKON.iller81(ctx, pr, t, { t0: -.35, aralik: .028, boyut: size, alpha: ilA * (1 - .6 * spot) });
      HL.forEach(([ad, t0], i) => {
        const next = HL[i + 1] ? HL[i + 1][1] : t0 + .8;
        const il = IKON.il(ad), xy = pr(il.nokta), z = IKON.zipla(t, t0, .5), a = win(t, t0, next, .15) * ilA;
        if (a <= 0) return;
        IKON.ciz(ctx, il.ikon, xy[0], xy[1] + z.dy * 40, 96 * z.olcek, { alpha: a });
        IKON.etiket(ctx, `${il.ad} · ${il.etiket}`, xy[0], xy[1] + 92, { boyut: 34, alpha: a });
      });
    }
    // bayraklar: kamera açıldıktan sonra sırayla saplanır
    FLAGS.forEach(([kod, lon, lat], i) => {
      const t0 = T.f0 + i * .12, p = IKON.pop(t, t0, .4), xy = pr([lon, lat]);
      const small = kod === 'kktc' || kod === 'cy';
      IKON.bayrak(ctx, kod, xy[0], xy[1], small ? 40 : 58, { bicim: 'direk', olcek: p.olcek, alpha: p.alpha, dalga: t });
    });
  },
  header(t, g) {
    const { T } = g;
    heading('81 il, 81 ikon', win(t, -1, T.s2, .25), { sub: 'Durdur, kendi ilini bul' });
    heading('Komşular bayrağıyla', win(t, T.s2 + .2, g.DUR + 1, .3), { sub: 'Bayrak = ülke, ikon = il' });
  },
  sounds: (T) => [
    ...Array.from({ length: 27 }, (_, i) => ({ t: .15 + i * .084, type: 'tick', gain: .05, f: 1300 + i * 20 })),
    ...HL.map(([, t0]) => ({ t: t0, type: 'ping', gain: .12, f: 784 })),
    { t: T.s2, type: 'whoosh', dur: .9, gain: .08 },
    ...Array.from({ length: FLAGS.length }, (_, i) => ({ t: T.f0 + i * .12, type: 'tick', gain: .06, f: 900 })),
  ],
});
</script>
</body>
</html>
