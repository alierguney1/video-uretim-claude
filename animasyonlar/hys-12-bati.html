// 16 Kasım 2026 için güneş sapması ve denklem zamanı (Meeus, tools/hys-12-bati.mjs ile aynı formül)
const SUN = (() => {
  const T = (Date.UTC(2026, 10, 16, 14) / 864e5 + 2440587.5 - 2451545) / 36525, R = RAD;
  const L0 = (280.46646 + T * (36000.76983 + T * 0.0003032)) % 360, M = 357.52911 + T * (35999.05029 - 0.0001537 * T);
  const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
  const Cc = Math.sin(M * R) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(2 * M * R) * (0.019993 - 0.000101 * T) + Math.sin(3 * M * R) * 0.000289;
  const om = 125.04 - 1934.136 * T, lam = L0 + Cc - 0.00569 - 0.00478 * Math.sin(om * R);
  const eps = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60 + 0.00256 * Math.cos(om * R);
  const dec = Math.asin(Math.sin(eps * R) * Math.sin(lam * R)), yv = Math.tan(eps * R / 2) ** 2;
  const eot = 4 / R * (yv * Math.sin(2 * L0 * R) - 2 * e * Math.sin(M * R) + 4 * e * yv * Math.sin(M * R) * Math.cos(2 * L0 * R) - .5 * yv * yv * Math.sin(4 * L0 * R) - 1.25 * e * e * Math.sin(2 * M * R));
  return { dec, eot };
})();
// saat τ'da (dk, UTC+3) güneşin battığı boylam, verilen enlemde: bunun doğusu gece
function nightEdge(lat, tau) {
  const ha = Math.acos(Math.cos(90.833 * RAD) / (Math.cos(lat * RAD) * Math.cos(SUN.dec)) - Math.tan(lat * RAD) * Math.tan(SUN.dec)) / RAD;
  return (720 - SUN.eot + 4 * ha - (tau - 180)) / 4;
}

function lonLine(path, lon, { color = C.accent, alpha = 1, t = 0, width = 5, from = 30, to = 50 } = {}) {

}
// sıra rozeti: daire içinde "4." vb. t0'da büyükten iner
function badge(x, y, n, t, t0, a, { color = C.land, ink = C.ocean, r = 46, empty = false } = {}) {
  if (a <= .001 || t < t0) return;
  const k = prog(t, t0, t0 + .18), s = lerp(1.9, 1, ease.outCubic(k));
  ctx.save(); ctx.globalAlpha = a * Math.min(1, k * 1.8); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = C.ocean; ctx.beginPath(); ctx.arc(0, 0, r + 6, 0, 2 * Math.PI); ctx.fill();
  if (empty) { ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.setLineDash([10, 8]); ctx.beginPath(); ctx.arc(0, 0, r - 3, 0, 2 * Math.PI); ctx.stroke(); ctx.setLineDash([]); }
  else { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(0, 0, r, 0, 2 * Math.PI); ctx.fill(); }
  ctx.fillStyle = empty ? color : ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `800 ${Math.round(r * 1.05)}px ${SANS}`; ctx.fillText(n + '.', r * .06, r * .06);
  ctx.restore();
}
function qmark(x, y, a, s = 1) { if (a > .001) text('?', x, y, 64 * s, { alpha: a, color: C.accent, align: 'center' }); }
function bracketH(x0, x1, y, str, a, { color = C.accent, size = 36 } = {}) {
  if (a <= .001) return;
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = 'round';

  text(str, (x0 + x1) / 2, y - 22, size, { font: MONO, weight: 500, color, alpha: a, align: 'center' });
}

// ── sıra şeridi: dört nokta Babakale'ye göre kaç km batıda (doğrusal ölçek) ──
const RUL = { x1: 900, x0: 180, y: 900 };
function ruler(t, a) {
  if (a <= .001) return;
  const pxKm = (RUL.x1 - RUL.x0) / D_GOK, X = d => RUL.x1 - d * pxKm;
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = C.bg;
  ctx.beginPath(); ctx.roundRect(SAFE.x0 - 40, RUL.y - 330, SAFE.x1 - SAFE.x0 + 80, 600, 26); ctx.fill(); ctx.restore();
  text('Babakale’ye göre kaç km batıda?', W / 2, RUL.y - 262, 38, { weight: 600, color: C.mute, alpha: a, align: 'center' });
  const P = [[GOK, D_GOK, 1, 'Gökçeada', '34 km'], [BOZ, D_BOZ, 3, 'Bozcaada', '> 8 km'], [ENEZ, D_ENEZ, 2, 'Enez', '> 2 km'], [BABA, 0, 4, 'Babakale', '0']];
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = C.text; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(RUL.x0 - 30, RUL.y); ctx.lineTo(RUL.x1 + 30, RUL.y); ctx.stroke(); ctx.restore();
  P.forEach(([p, d, n, ad, s], i) => {
    const k = prog(t, T.rul + i * .18, T.rul + i * .18 + .3), x = X(d);

      { t: T.s3, type: 'whoosh', dur: .6, gain: .1 }, { t: T.boz, type: 'tick', gain: .45, f: 300 },
      { t: T.ada, type: 'whoosh', dur: .5, gain: .08 }, { t: T.pan, type: 'whoosh', dur: 1.0, gain: .1 },
      { t: T.enez, type: 'tick', gain: .45, f: 420 },
      ...Array.from({ length: 5 }, (_, i) => ({ t: T.br - .9 + i * .16, type: 'tick', gain: .1, f: 800 + i * 120 })),
      { t: T.br, type: 'ping', gain: .3, f: 698 },
      { t: T.s5 + .2, type: 'whoosh', dur: 1.0, gain: .1 },
      { t: T.gok + .1, type: 'ping2', gain: .45 },
      ...Array.from({ length: 4 }, (_, i) => ({ t: T.rul + i * .18, type: 'tick', gain: .14, f: 1500 - i * 200 })),
      { t: T.s7 + .1, type: 'whoosh', dur: 1.2, gain: .1 },
      ...Array.from({ length: 12 }, (_, i) => ({ t: T.clk0 + (T.clk1 - T.clk0) * i / 11, type: 'tick', gain: .07, f: 1700 })),
      { t: T.clk0 + (T.clk1 - T.clk0) * (SET_IGDIR - 16 * 60 - 40) / 82, type: 'tick', gain: .3, f: 220 },
      { t: T.s8 + .1, type: 'ping', gain: .38, f: 784 },
      ...Array.from({ length: 9 }, (_, i) => ({ t: T.s9 + .1 + i * .07, type: 'tick', gain: .08, f: 1300 + i * 30 })),
      { t: T.s10, type: 'whoosh', dur: .8, gain: .1 },
      { t: T.loop, type: 'whoosh', dur: .9, gain: .08 },
    ];
  },
});

// saat: 16:40 → 18:02, clk0..clk1
const tau = t => 16 * 60 + 40 + 82 * ease.inOutSine(prog(t, T.clk0, T.clk1));

function drawMap(t, g) {
  const { path, pr, T, DUR, cam } = g;
  const xy = p => pr(p);
  // zemin: uzakta world-atlas 50m, yakında NE 1:10m kıyılar
  const near = prog(cam.k, 30, 70);
  baseMap(path, { sphere: false, fine: true, landAlpha: 1 - near });
  const islA = 1 - .75 * win(t, T.ada, T.s5 + .2, .4);
  fillFeature(path, KIYI.Greece, { color: C.land, alpha: near });
  fillFeature(path, KIYI.Bulgaria, { color: C.land, alpha: near });
  fillFeature(path, MAIN, { color: C.land, alpha: 1 });
  ISL.forEach(f => fillFeature(path, f, { color: C.land, alpha: islA }));
  ctx.save(); ctx.strokeStyle = 'rgba(15,28,38,.6)'; ctx.lineWidth = 1.6; ctx.globalAlpha = Math.max(near, .5);
  ctx.beginPath(); path(KIYI.Turkey); ctx.stroke(); ctx.restore();

  // gece: 16 Kasım gün batımı çizgisinin doğusu
  const nA = win(t, T.clk0 - .3, T.s9 + .2, .3);
  if (nA > 0) {
    const tt = tau(t), lats = Array.from({ length: 61 }, (_, i) => 25 + i * .5);
    const e0 = nightEdge(25, tt), e1 = nightEdge(55, tt), n = 40;
    // üst ve alt kenarlar paralel boyunca sık noktalı (d3 düz kenarı büyük daire yayı olarak çizer)
    const poly = [...lats.map(la => [nightEdge(la, tt), la]),
      ...Array.from({ length: n }, (_, i) => [e1 + (70 - e1) * (i + 1) / n, 55]),
      ...Array.from({ length: n }, (_, i) => [70 - (70 - e0) * (i + 1) / n, 25])];
    ctx.save(); ctx.globalAlpha = .62 * nA; ctx.fillStyle = '#03080C';
    ctx.beginPath(); path({ type: 'Polygon', coordinates: [[...poly, poly[0]]] }); ctx.fill(); ctx.restore();
    // ikonlar: Iğdır ay, Gökçeada güneş → ay
    const ig = xy(IGDIR), gk = xy(GOK);
    const igN = tt >= SET_IGDIR, gkN = tt >= SET_GOK;
    pin(ig, { color: C.text, r: 9, alpha: nA }); pin(gk, { color: C.accent, r: 9, alpha: nA });
    IKON.ciz(ctx, igN ? 'f:crescent-moon' : 'f:sun', ig[0] - 10, ig[1] - 70, 64, { alpha: nA, ...(igN ? IKON.pop(t, T.clk0 + (T.clk1 - T.clk0) * .1, .4) : {}) });
    IKON.ciz(ctx, gkN ? 'f:crescent-moon' : 'f:sun', gk[0] + 10, gk[1] - 70, 64, { alpha: nA });
    IKON.etiket(ctx, 'Iğdır', ig[0] - 10, ig[1] + 40, { boyut: 30, alpha: nA });
    IKON.etiket(ctx, 'Gökçeada', gk[0] + 40, gk[1] + 40, { boyut: 30, alpha: nA });
    // büyük saat
    const cA = win(t, T.clk0 - .2, T.s8 + .2, .3);
    ctx.save(); ctx.globalAlpha = .92 * cA; ctx.fillStyle = C.ocean; ctx.beginPath(); ctx.roundRect(W / 2 - 220, 600, 440, 150, 24); ctx.fill(); ctx.restore();
    text(hhmm(tt), W / 2, 712, 112, { font: MONO, weight: 500, color: C.text, alpha: cA, align: 'center' });
    // 73 dakika
    const dA = win(t, T.s8, T.s9 + .2, .3);
    if (dA > 0) {
      const s = 1 + .25 * (1 - ease.outCubic(prog(t, T.s8, T.s8 + .35)));
      ctx.save(); ctx.globalAlpha = .94 * dA; ctx.fillStyle = C.ocean; ctx.beginPath(); ctx.roundRect(W / 2 - 320, 590, 640, 220, 24); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(W / 2, 700); ctx.scale(s, s);
      text((SET_GOK - SET_IGDIR) + ' dakika', 0, 0, 104, { color: C.accent, alpha: dA, align: 'center' }); ctx.restore();
      text('Iğdır ' + hhmm(SET_IGDIR) + ' · Gökçeada ' + hhmm(SET_GOK), W / 2, 782, 36, { font: MONO, weight: 500, color: C.text, alpha: dA, align: 'center' });
    }
  }

  // boylam çizgileri
  const bA = Math.max(win(t, 0, T.s7 + .2, .01), prog(t, T.loop + .1, DUR - .2));
  lonLine(path, BABA[0], { alpha: bA, t, color: t < T.s3 ? C.accent : C.land, width: t < T.s3 ? 5 : 4 });
  lonLine(path, BOZ[0], { alpha: win(t, T.boz - .2, T.ada + .3, .3), t, color: C.land, width: 4 });
  lonLine(path, ENEZ[0], { alpha: win(t, T.enez - .1, T.s7 + .2, .3), t, color: C.land, width: 4 });
  lonLine(path, GOK[0], { alpha: win(t, T.gok, T.s7 + .2, .3), t, color: C.accent, width: 5 });

  // 4 · Babakale
  if (t < T.s4 + .6 || t > T.loop) {
    const b = xy(BABA), a = t > T.loop ? prog(t, T.loop + .2, DUR - .2) : 1 - prog(t, T.s4, T.s4 + .5);
    pin(b, { color: C.accent, r: 13, alpha: a, pulse: t < T.dort ? (t * 1.1) % 1 : 0 });
    const p = IKON.pop(t, .5, .45), ik = IKON.il('Çanakkale');
    IKON.ciz(ctx, ik.ikon, b[0] + 120, b[1] + 20, 96 * p.olcek, { alpha: a * p.alpha, aci: p.aci });
    IKON.etiket(ctx, 'Babakale', b[0] + 120, b[1] + 100, { boyut: 34, alpha: a });
    if (t < T.loop) badge(b[0] - 80, b[1] - 90, 4, t, T.dort, a, { color: RED, ink: C.text });
    // doğru ama kartı
    const kA = win(t, T.asya, T.s3 + .1, .3) * a;
    if (kA > 0) {
      ctx.save(); ctx.globalAlpha = .94 * kA; ctx.fillStyle = C.ocean; ctx.beginPath(); ctx.roundRect(SAFE.x0 - 10, b[1] - 330, 610, 170, 20); ctx.fill(); ctx.restore();
      text('✓ Asya’nın en batı ucu', SAFE.x0 + 16, b[1] - 262, 44, { weight: 800, color: C.accent, alpha: kA });
      text('✗ Türkiye’nin en batı ucu', SAFE.x0 + 16, b[1] - 192, 44, { weight: 800, color: RED, alpha: kA * prog(t, T.degil, T.degil + .2) });
    }
  }
  // 3 · Bozcaada
  if (t > T.boz - .3 && t < T.s5 + .3) {
    const z = xy(BOZ), a = win(t, T.boz - .3, T.s5 + .3, .3) * (1 - .6 * win(t, T.ada, T.s5 + .3, .3));
    pin(z, { color: C.land, r: 11, alpha: a });
    badge(z[0] - 90, z[1] - 60, 3, t, T.boz, a);
    IKON.etiket(ctx, 'Bozcaada', z[0] - 60, z[1] + 56, { boyut: 32, alpha: a });
  }
  // 2 · Enez
  if (t > T.enez - .3 && t < T.s7 + .3) {
    const e = xy(ENEZ), a = win(t, T.enez - .3, T.s6, .3);
    pin(e, { color: C.land, r: 12, alpha: a });
    badge(e[0] - 100, e[1] - 110, 2, t, T.enez, a);
    const p = IKON.pop(t, T.enez + .2, .45), ik = IKON.il('Edirne');
    IKON.ciz(ctx, ik.ikon, e[0] + 150, e[1] - 150, 92 * p.olcek, { alpha: a * p.alpha, aci: p.aci });
    IKON.etiket(ctx, 'Enez · Edirne', e[0] + 150, e[1] - 76, { boyut: 32, alpha: a });
    const gp = IKON.pop(t, T.enez + .5, .4), gr = xy([25.95, 40.88]);   // Yunanistan kıyısı (NE 1:10m içinde); yakınlaşmadan önce söner
    IKON.bayrak(ctx, 'gr', gr[0], gr[1], 42, { bicim: 'direk', olcek: gp.olcek, alpha: a * gp.alpha * (1 - prog(t, T.br - 1.6, T.br - 1.1)), dalga: t });
    // Babakale çizgisiyle arası
    const bx = xy([BABA[0], ENEZ[1]])[0];
    if (bx - e[0] > 40) bracketH(e[0], bx, e[1] + 150, '> 2 km', a * prog(t, T.br, T.br + .3), { size: 44 });
    IKON.etiket(ctx, 'Babakale hizası', bx + 40, e[1] + 250, { boyut: 26, alpha: a * prog(t, T.br, T.br + .3), zemin: C.ocean, renk: C.mute });
  }
  // 1 · Gökçeada
  if (t > T.s5 - .2 && t < T.s7 + .4) {
    const k = xy(GOK), a = win(t, T.s5 + .3, T.s7 + .4, .3) * (1 - win(t, T.rul - .2, T.s7 + .2, .3));
    pin(k, { color: C.accent, r: 13, alpha: a, pulse: (t * 1.1) % 1 });
    if (t < T.gok) { qmark(k[0] - 4, k[1] - 34, a, .9); badge(k[0] + 20, k[1] - 160, 1, t, T.soru, a, { color: C.accent, empty: true }); }
    else {
      badge(k[0] + 20, k[1] - 160, 1, t, T.gok, a, { color: C.accent });
      const p = IKON.pop(t, T.gok + .25, .45), ik = IKON.il('Çanakkale');
      IKON.ciz(ctx, ik.ikon, k[0] + 200, k[1] + 30, 92 * p.olcek, { alpha: a * p.alpha, aci: p.aci });
      IKON.etiket(ctx, 'İncirburnu · Gökçeada', k[0] + 110, k[1] + 110, { boyut: 32, alpha: a, zemin: C.accent, renk: C.ocean });
    }
  }
  // cliffhanger: üç uç ✓, doğuda ?
  const cA = win(t, T.s10 + .2, T.loop + .3, .3);
  if (cA > 0) {
    [[HATAY, 'Hatay · güney', 'Hatay', -70], [KOFCAZ, 'Kofçaz · kuzey', 'Kırklareli', -60], [GOK, 'Gökçeada · batı', 'Çanakkale', 60]].forEach(([p, s, il, dy], i) => {
      const q = xy(p), k = cA * prog(t, T.s10 + .3 + i * .25, T.s10 + .6 + i * .25), pp = IKON.pop(t, T.s10 + .3 + i * .25, .4);
      pin(q, { color: C.accent, r: 10, alpha: k });
      IKON.ciz(ctx, IKON.il(il).ikon, q[0], q[1] - 54, 56 * pp.olcek, { alpha: k * pp.alpha });
      IKON.etiket(ctx, s + ' ✓', q[0] + (i === 2 ? 110 : i === 1 ? 60 : 0), q[1] + dy + (dy > 0 ? 10 : -40), { boyut: 32, alpha: k });
    });
    const e = xy([44.3, 38.9]);
    qmark(e[0], e[1] + 20, cA * prog(t, T.s10 + 1.3, T.s10 + 1.6) * (.75 + .25 * Math.sin(t * 7)), 1.5);
  }
}

function drawList(t, a) {
  const cols = 3, rows = 27, x0 = SAFE.x0 - 18, colW = (SAFE.x1 - SAFE.x0 + 36) / cols, y0 = 520, rowH = 37.5;
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = C.bg; ctx.fillRect(0, 480, W, H - 480); ctx.restore();
  GB.forEach(([il, saat, dk], i) => {
    const c = Math.floor(i / rows), r = i % rows, x = x0 + c * colW, y = y0 + r * rowH;
    const k = prog(t, T.s9 + .05 + i * .008, T.s9 + .25 + i * .008), al = a * k;
    if (al <= .001) return;
    const hl = il === 'Iğdır' || il === 'İzmir';
    if (hl) { ctx.globalAlpha = al * (.72 + .28 * Math.sin(t * 6.3)); ctx.fillStyle = C.accent; ctx.beginPath(); ctx.roundRect(x - 6, y - 27, colW - 8, 36, 8); ctx.fill(); ctx.globalAlpha = 1; }
    const ik = IKON.il(il);
    if (ik) IKON.ciz(ctx, ik.ikon, x + 14, y - 9, 30, { alpha: al });
    const right = x + colW - 16, s2 = saat + ' ' + String(dk).padStart(2, ' ');
    ctx.font = `500 21px ${MONO}`; const w2 = ctx.measureText(s2).width;
    text(saat, right - w2, y, 21, { font: MONO, weight: 500, color: hl ? C.ocean : C.mute, alpha: al });
    text(String(dk), right, y, 21, { font: MONO, weight: 500, color: hl ? C.ocean : C.accent, alpha: al, align: 'right' });
    let size = 24; ctx.font = `600 ${size}px ${SANS}`;
    const room = colW - 50 - w2 - 12, need = ctx.measureText(il).width;
    if (need > room) size = Math.max(15, size * room / need);
    text(il, x + 34, y, size, { weight: 600, color: hl ? C.ocean : C.text, alpha: al });
  });
  text('16 Kasım gün batımı (il merkezi) · turuncu: Gökçeada’dan kaç dk önce', SAFE.x0, y0 + rows * rowH + 6, 24, { weight: 600, color: C.mute, alpha: a });
}
